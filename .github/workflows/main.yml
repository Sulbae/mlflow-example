name: CI MLflow

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  CSV_URL: "./project/train_pca.csv"
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE
      - uses: actions/checkout@v3

      # Setup Python 3.12.7
      - name: Set up Python 3.12.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.12"

      # Check Env Variables
      - name: Check Path
        run: |
          echo $CSV_URL

      # Install mlflow
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dagshub "mlflow>=2,<3" pandas numpy scikit-learn
      
      # Set DagsHub MLflow credentials
      - name: Set env for DagsHub
        run: |
          echo MLFLOW_TRACKING_USERNAME=${{ secrets.DAGSHUB_USERNAME }} >> $GITHUB_ENV
          echo MLFLOW_TRACKING_PASSWORD=${{ secrets.DAGSHUB_TOKEN }} >> $GITHUB_ENV
          echo MLFLOW_TRACKING_URI=https://dagshub.com/Sulbae/Latihan-MLFlow.mlflow >> $GITHUB_ENV

      # Run mlflow project: train_fixed
      - name: Run mlflow project for Fixed Model
        run: |
          mlflow run ./project -e train_fixed -P dataset=$CSV_URL
      
      # Run mlflow project: train_tuning
      - name: Run mlflow project for Tuning Model
        run: |
          mlflow run ./project -e train_tuning -P dataset=$CSV_URL